<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museum</title>
  <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <header class="header">
    <div class="header__inner container">
      <a class="header__logo logo" href="#">
        <span class="icon icon--logo"></span>
        <h1 class="logo__title">Louvre</h1>
      </a>
      <nav class="header__menu">
        <ul class="header__menu-list">
          <li class="header__menu-item">
            <a class="header__menu-link" href="#">Visiting</a>
          </li>
          <li class="header__menu-item">
            <a class="header__menu-link" href="#">Explore</a>
          </li>
          <li class="header__menu-item">
            <a class="header__menu-link" href="#">Video</a>
          </li>
          <li class="header__menu-item">
            <a class="header__menu-link" href="#">Gallery</a>
          </li>
          <li class="header__menu-item">
            <a class="header__menu-link" href="#">Tickets</a>
          </li>
          <li class="header__menu-item">
            <a class="header__menu-link" href="#">Contacts</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="main">
    <div class="welcome">
      <div class="welcome__inner container">
        <div class="welcome__body">
          <h2 class="welcome__title title__light">Welcome to&nbsp;the Louvre</h2>
          <div class="welcome__description">
            <p>From the castle to the museum</p>
          </div>
          <a 
            class="welcome__link button button__welcome" 
            href="https://www.google.com/maps/@48.8618159,2.3366818,3a,75y,81.55h,73.4t/data=!3m7!1e1!3m5!1sAF1QipOVxZQuSy3Bx9T_HpH_7FtBHDTXvI6SF-A10ocT!2e10!3e12!7i5472!8i2736"
            target="_blank"
          >
            Discover the Louvre
          </a>
        </div>
        <div class="welcome__slider">
          <div class="welcome__slider-line">
            <div class="welcome__slider-item">
              <img 
                class="wlcome__slider-image" 
                src="assets/img/welcome-slider/1.jpg" 
                alt=""
                width="1000"
                height="750"
                loading="lazy">
            </div>
            <div class="welcome__slider-item">
              <img 
                class="wlcome__slider-image" 
                src="assets/img/welcome-slider/2.jpg" 
                alt=""
                width="1000"
                height="750"
                loading="lazy">
            </div>
            <div class="welcome__slider-item">
              <img 
                class="wlcome__slider-image" 
                src="assets/img/welcome-slider/3.jpg" 
                alt=""
                width="1000"
                height="750"
                loading="lazy">
            </div>
            <div class="welcome__slider-item">
              <img 
                class="wlcome__slider-image" 
                src="assets/img/welcome-slider/4.jpg" 
                alt=""
                width="1000"
                height="750"
                loading="lazy">
            </div>
            <div class="welcome__slider-item">
              <img 
                class="wlcome__slider-image" 
                src="assets/img/welcome-slider/5.jpg" 
                alt=""
                width="1000"
                height="750"
                loading="lazy">
            </div>
          </div>
          <div class="welcome__slider-controls">
            <p class="welcome__slider-numbers">
              <span class="welcome__slider-number-active">01</span> |
              <span class="welcome__slider-number-max">05</span>
            </p>
            <div class="welcome__slider-bullets" aria-label="Slider navigation">
              <span class="welcome__slider-bullets-item is-active" aria-current="true"></span>
              <span class="welcome__slider-bullets-item"></span>
              <span class="welcome__slider-bullets-item"></span>
              <span class="welcome__slider-bullets-item"></span>
              <span class="welcome__slider-bullets-item"></span>
            </div>
            <div class="welcome__slider-arrows">
              <button class="welcome__slider-arrows-button" aria-label="Previous slide">
                <span class="welcome__slider-arrow-icon icon icon--arrow-prev" aria-hidden="true"></span>
              </button>
              <button class="welcome__slider-arrows-button" aria-label="Next slide">
                <span class="welcome__slider-arrow-icon icon icon--arrow-next" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
